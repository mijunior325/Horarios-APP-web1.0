services:
  react-app:
    build: .
    ports:
      - "5173:5173"
    command: npm run dev
    volumes:
      - .:/app
      - /app/node_modules
    environment:
       - CHOKIDAR_USEPOLLING=true
  server:
    build: .
    ports:
      - "3001:3001"
    command: npm run server
    volumes:
      - .:/app
      - /app/node_modules
    environment:
       - CHOKIDAR_USEPOLLING=true

